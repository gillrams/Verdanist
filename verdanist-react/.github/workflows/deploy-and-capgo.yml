name: Deploy to Capgo (OTA)

on:
  push:
    branches:
      - main

jobs:
  deploy-capgo:
    name: Build & Upload to Capgo
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: verdanist-react

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: verdanist-react/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Upload bundle to Capgo
        run: npx @capgo/cli@latest bundle upload --channel production
        env:
          CAPGO_TOKEN: ${{ secrets.CAPGO_TOKEN }}
