<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Verdanist - Login</title>
    <!-- Supabase SDK - MUST LOAD FIRST -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "secondary-fixed": "#b1f2be",
                        "on-tertiary-container": "#004564",
                        "inverse-primary": "#006e2f",
                        "on-primary-fixed-variant": "#005321",
                        "on-secondary": "#00391a",
                        "on-primary-container": "#004b1e",
                        "on-tertiary-fixed-variant": "#004c6e",
                        "surface-variant": "#383432",
                        "on-secondary-fixed": "#00210d",
                        "outline": "#869585",
                        "primary": "#4be277",
                        "secondary-fixed-dim": "#96d5a3",
                        "tertiary": "#8bcfff",
                        "on-primary": "#003915",
                        "surface-container-low": "#1e1b19",
                        "surface-container-high": "#2d2927",
                        "surface-container-highest": "#383432",
                        "on-tertiary-fixed": "#001e2f",
                        "on-surface-variant": "#bccbb9",
                        "inverse-surface": "#e9e1dd",
                        "primary-container": "#22c55e",
                        "surface-dim": "#161311",
                        "surface": "#161311",
                        "primary-fixed-dim": "#4ae176",
                        "primary-fixed": "#6bff8f",
                        "error-container": "#93000a",
                        "secondary": "#96d5a3",
                        "on-background": "#e9e1dd",
                        "secondary-container": "#15542e",
                        "on-secondary-fixed-variant": "#12512c",
                        "on-secondary-container": "#88c796",
                        "error": "#ffb4ab",
                        "surface-tint": "#4ae176",
                        "on-error": "#690005",
                        "inverse-on-surface": "#33302d",
                        "tertiary-fixed": "#c9e6ff",
                        "on-surface": "#e9e1dd",
                        "surface-container": "#221f1d",
                        "surface-bright": "#3c3836",
                        "on-tertiary": "#00344d",
                        "on-primary-fixed": "#002109",
                        "background": "#161311",
                        "surface-container-lowest": "#100e0c",
                        "tertiary-container": "#36b6fb",
                        "tertiary-fixed-dim": "#89ceff",
                        "outline-variant": "#3d4a3d",
                        "on-error-container": "#ffdad6"
                    },
                    borderRadius: {
                        DEFAULT: "1rem",
                        lg: "2rem",
                        xl: "3rem",
                        full: "9999px"
                    },
                    fontFamily: {
                        headline: ["Plus Jakarta Sans", "sans-serif"],
                        body: ["Manrope", "sans-serif"],
                        label: ["Manrope", "sans-serif"]
                    }
                },
            },
        }
    </script>
    <style>
        body { font-family: 'Manrope', sans-serif; }
        h1, h2, h3, h4, h5, h6, .font-headline { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-panel {
            background-color: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .dark .glass-panel {
            background-color: rgba(34, 31, 29, 0.85);
        }
        .google-btn {
            background: #ffffff;
            color: #161311;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .google-btn:hover {
            background: #f0f0f0;
        }
    </style>
</head>
<body class="bg-gray-50 dark:bg-background text-gray-900 dark:text-on-background min-h-screen flex items-center justify-center relative overflow-auto py-8 transition-colors duration-300">
    <!-- Ambient Background Elements -->
    <div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">
        <div class="absolute -top-[20%] -left-[10%] w-[50vw] h-[50vw] rounded-full bg-primary/10 blur-[120px]"></div>
        <div class="absolute bottom-[10%] -right-[10%] w-[40vw] h-[40vw] rounded-full bg-secondary/10 blur-[100px]"></div>
    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="fixed inset-0 z-50 hidden items-center justify-center bg-white/80 dark:bg-background/80 backdrop-blur-sm">
        <div class="flex flex-col items-center gap-4">
            <div class="w-12 h-12 border-4 border-primary border-t-transparent rounded-full animate-spin"></div>
            <p class="text-gray-600 dark:text-on-surface font-body text-sm">Authenticating...</p>
        </div>
    </div>

    <!-- Main Content Container -->
    <main class="w-full max-w-md px-6 z-10">
        <!-- Login Card -->
        <div class="glass-panel rounded-xl p-10 flex flex-col items-center border border-gray-200 dark:border-outline-variant/15 shadow-xl dark:shadow-[0_48px_48px_-12px_rgba(0,0,0,0.5)]">
            <!-- Brand Anchor -->
            <div class="mb-8 text-center">
                <span class="material-symbols-outlined text-primary text-5xl mb-4" style="font-variation-settings: 'FILL' 1;">potted_plant</span>
                <h1 class="font-headline font-black tracking-tight text-3xl text-primary mb-1">Verdanist</h1>
                <p class="font-body text-gray-500 dark:text-on-surface-variant text-sm">Persada Farm Conservatory</p>
            </div>

            <!-- Google Sign In Button -->
            <button onclick="handleGoogleSignIn()" class="google-btn w-full rounded-full py-3.5 px-6 font-body font-semibold text-sm flex items-center justify-center gap-3 mb-6 transition-all hover:shadow-lg active:scale-95">
                <svg class="w-5 h-5" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                Continue with Google
            </button>

            <!-- Divider -->
            <div class="w-full flex items-center gap-4 mb-6">
                <div class="flex-1 h-px bg-gray-300 dark:bg-outline-variant/30"></div>
                <span class="text-gray-500 dark:text-on-surface-variant text-xs font-body">or</span>
                <div class="flex-1 h-px bg-gray-300 dark:bg-outline-variant/30"></div>
            </div>

            <!-- Form -->
            <form id="auth-form" class="w-full flex flex-col gap-5">
                <!-- Email Input -->
                <div class="flex flex-col gap-2">
                    <label class="font-label text-xs font-medium tracking-wide text-gray-500 dark:text-on-surface-variant uppercase" for="email">Email Address</label>
                    <div class="relative flex items-center">
                        <span class="material-symbols-outlined absolute left-4 text-gray-400 dark:text-on-surface-variant text-lg">mail</span>
                        <input class="w-full bg-white dark:bg-surface-container-low border border-gray-300 dark:border-outline-variant/30 text-gray-900 dark:text-on-surface rounded-lg py-4 pl-12 pr-4 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors font-body text-sm" id="email" name="email" placeholder="manager@verdanist.com" required="" type="email"/>
                    </div>
                </div>

                <!-- Password Input -->
                <div class="flex flex-col gap-2">
                    <div class="flex justify-between items-center">
                        <label class="font-label text-xs font-medium tracking-wide text-gray-500 dark:text-on-surface-variant uppercase" for="password">Password</label>
                        <a class="font-body text-xs text-primary hover:text-secondary-fixed transition-colors" href="#" onclick="showForgotPasswordModal(); return false;">Forgot Password?</a>
                    </div>
                    <div class="relative flex items-center">
                        <span class="material-symbols-outlined absolute left-4 text-gray-400 dark:text-on-surface-variant text-lg">lock</span>
                        <input class="w-full bg-white dark:bg-surface-container-low border border-gray-300 dark:border-outline-variant/30 text-gray-900 dark:text-on-surface rounded-lg py-4 pl-12 pr-12 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors font-body text-sm" id="password" name="password" placeholder="••••••••" required="" type="password"/>
                        <button class="absolute right-4 text-gray-400 dark:text-on-surface-variant hover:text-gray-600 dark:hover:text-on-surface transition-colors" type="button" onclick="togglePasswordVisibility()">
                            <span class="material-symbols-outlined text-lg" id="password-toggle-icon">visibility_off</span>
                        </button>
                    </div>
                </div>

                <!-- Remember Me -->
                <div class="flex items-center gap-3 mt-1">
                    <input class="w-4 h-4 rounded border-gray-300 dark:border-outline-variant/30 bg-white dark:bg-surface-container-low text-primary focus:ring-primary focus:ring-offset-gray-50 dark:focus:ring-offset-background" id="remember" name="remember" type="checkbox"/>
                    <label class="font-body text-sm text-gray-600 dark:text-on-surface-variant" for="remember">Keep me signed in</label>
                </div>

                <!-- Submit Button -->
                <button class="w-full mt-2 bg-gradient-to-r from-primary to-primary-container text-on-primary font-headline font-bold text-lg rounded-full py-4 shadow-[0_8px_16px_-4px_rgba(75,226,119,0.3)] hover:shadow-[0_12px_24px_-4px_rgba(75,226,119,0.4)] transform hover:-translate-y-0.5 transition-all active:scale-95 duration-200 flex items-center justify-center gap-2" type="submit">
                    Access Conservatory
                    <span class="material-symbols-outlined text-lg">arrow_forward</span>
                </button>
            </form>

            <!-- Sign Up Link -->
            <div class="mt-8 pt-6 border-t border-gray-200 dark:border-outline-variant/15 w-full text-center">
                <p class="font-body text-sm text-gray-600 dark:text-on-surface-variant">
                    New to the farm?
                    <a class="text-primary font-semibold hover:text-secondary-fixed transition-colors ml-1" href="create-account.html">Cultivate an Account</a>
                </p>
            </div>
        </div>

        <!-- Back to Home -->
        <div class="mt-6 text-center">
            <a href="../index.html" class="inline-flex items-center gap-2 text-gray-500 dark:text-on-surface-variant hover:text-primary transition-colors font-body text-sm">
                <span class="material-symbols-outlined text-sm">arrow_back</span>
                Back to Home
            </a>
        </div>
    </main>

    <!-- Forgot Password Modal -->
    <div id="forgot-password-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/40 dark:bg-black/60 backdrop-blur-sm opacity-0 transition-opacity duration-300">
        <div class="glass-panel rounded-xl p-8 max-w-md w-full mx-4 border border-gray-200 dark:border-outline-variant/15 shadow-2xl transform scale-95 transition-transform duration-300" id="forgot-modal-content">
            <div class="text-center mb-6">
                <div class="w-14 h-14 rounded-full bg-primary/20 flex items-center justify-center mx-auto mb-4">
                    <span class="material-symbols-outlined text-primary text-2xl">mail</span>
                </div>
                <h3 class="font-headline text-xl font-bold text-gray-900 dark:text-on-surface mb-2">Reset Password</h3>
                <p class="font-body text-sm text-gray-600 dark:text-on-surface-variant">Enter your email and we'll send you a reset link.</p>
            </div>
            
            <form id="forgot-password-form" onsubmit="sendResetPasswordEmail(event)">
                <div class="flex flex-col gap-2 mb-4">
                    <label class="font-label text-xs font-medium tracking-wide text-gray-500 dark:text-on-surface-variant uppercase">Email Address</label>
                    <div class="relative flex items-center">
                        <span class="material-symbols-outlined absolute left-4 text-gray-400 dark:text-on-surface-variant text-lg">mail</span>
                        <input type="email" id="reset-email" placeholder="manager@verdanist.com" required
                            class="w-full bg-white dark:bg-surface-container-low border border-gray-300 dark:border-outline-variant/30 text-gray-900 dark:text-on-surface rounded-lg py-3.5 pl-12 pr-4 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors font-body text-sm"/>
                    </div>
                </div>

                <div id="reset-message" class="hidden mb-4 p-3 rounded-lg text-sm font-body"></div>

                <div class="flex gap-3">
                    <button type="button" onclick="hideForgotPasswordModal()" class="flex-1 py-3 rounded-full border border-gray-300 dark:border-outline-variant text-gray-600 dark:text-on-surface-variant hover:bg-gray-100 dark:hover:bg-surface-container-high transition-all font-body text-sm font-semibold">
                        Cancel
                    </button>
                    <button type="submit" id="reset-submit-btn" class="flex-1 py-3 rounded-full bg-gradient-to-r from-primary to-primary-container text-on-primary font-body text-sm font-semibold hover:shadow-[0_8px_24px_rgba(75,226,119,0.3)] transition-all">
                        Send Link
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Supabase Client -->
    <script src="../js/auth/supabase-client.js"></script>
    
    <!-- Auth Logic -->
    <script>
        // Get Supabase client
        function getSupabase() {
            if (window.supabase) return window.supabase;
            if (window.initSupabase) return window.initSupabase();
            return null;
        }

        // Show loading overlay
        function showLoading() {
            document.getElementById('loadingOverlay').classList.remove('hidden');
            document.getElementById('loadingOverlay').classList.add('flex');
        }

        // Hide loading overlay
        function hideLoading() {
            document.getElementById('loadingOverlay').classList.add('hidden');
            document.getElementById('loadingOverlay').classList.remove('flex');
        }

        // Show notification (console only - toast removed)
        function showToast(message, type = 'success') {
            console.log(`[${type.toUpperCase()}] ${message}`);
            // Optionally show alert for errors
            if (type === 'error') {
                alert(message);
            }
        }

        function hideToast() {
            // No-op - toast element removed
        }

        // Toggle password visibility
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('password-toggle-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.textContent = 'visibility';
            } else {
                passwordInput.type = 'password';
                toggleIcon.textContent = 'visibility_off';
            }
        }

        // Get user role from profiles
        async function getUserRole(supabase) {
            if (!supabase) return null;
            try {
                const { data: { session } } = await supabase.auth.getSession();
                if (!session) return null;
                
                const { data: profile, error } = await supabase
                    .from('profiles')
                    .select('role')
                    .eq('id', session.user.id)
                    .single();
                
                if (error) {
                    console.error('Error fetching role:', error);
                    return null;
                }
                
                return profile?.role || 'farmer';
            } catch (err) {
                console.error('Error getting user role:', err);
                return null;
            }
        }

        // Redirect based on role
        async function patientRedirect(supabase) {
            if (!supabase) return;
            
            const role = await getUserRole(supabase);
            
            if (role === 'admin') {
                window.location.href = 'admin-users.html';
            } else {
                window.location.href = 'dashboard.html';
            }
        }

        // Handle Google Sign In
        async function handleGoogleSignIn() {
            const supabase = getSupabase();
            if (!supabase) {
                showToast('Database connection failed', 'error');
                return;
            }

            showLoading();

            try {
                const { error } = await supabase.auth.signInWithOAuth({
                    provider: 'google',
                    options: {
                        redirectTo: window.location.origin + '/pages/login.html'
                    }
                });

                if (error) throw error;
            } catch (err) {
                hideLoading();
                console.error('Google sign in error:', err);
                showToast('Google sign in failed: ' + err.message, 'error');
            }
        }

        // Handle email/password login
        async function handleLogin(event) {
            event.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const remember = document.getElementById('remember').checked;
            
            if (!email || !password) {
                showToast('Please enter email and password', 'error');
                return;
            }

            const supabase = getSupabase();
            if (!supabase) {
                showToast('Database connection failed', 'error');
                return;
            }

            showLoading();

            try {
                const { data, error } = await supabase.auth.signInWithPassword({
                    email,
                    password
                });

                if (error) throw error;

                showToast('Welcome back!', 'success');
                
                // Small delay for toast to show
                setTimeout(() => {
                    patientRedirect(supabase);
                }, 1000);

            } catch (err) {
                hideLoading();
                console.error('Login error:', err);
                showToast('Login failed: ' + err.message, 'error');
            }
        }

        // Handle OAuth callback
        async function handleAuthCallback() {
            const supabase = getSupabase();
            if (!supabase) return;
            
            if (window.location.hash.includes('access_token') || window.location.search.includes('code=')) {
                showLoading();
                
                let attempts = 0;
                const maxAttempts = 10;
                
                while (attempts < maxAttempts) {
                    const { data: { session } } = await supabase.auth.getSession();
                    
                    if (session) {
                        showToast('Welcome!', 'success');
                        setTimeout(() => {
                            patientRedirect(supabase);
                        }, 1000);
                        return;
                    }
                    
                    attempts++;
                    await new Promise(r => setTimeout(r, 500));
                }
                
                hideLoading();
                showToast('Authentication timeout', 'error');
            }
        }

        // Check existing session
        async function checkExistingSession() {
            const supabase = getSupabase();
            if (!supabase) return;
            
            if (window.location.hash.includes('access_token') || window.location.search.includes('code=')) {
                return;
            }
            
            const { data: { session } } = await supabase.auth.getSession();
            
            if (session) {
                showToast('Welcome back, Manager!', 'success');
                setTimeout(() => {
                    patientRedirect(supabase);
                }, 1500);
            }
        }

        // Forgot Password Modal Functions
        function showForgotPasswordModal() {
            const modal = document.getElementById('forgot-password-modal');
            const content = document.getElementById('forgot-modal-content');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            
            // Small delay for animation
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                content.classList.remove('scale-95');
                content.classList.add('scale-100');
            }, 10);
            
            document.getElementById('reset-email').value = '';
            document.getElementById('reset-message').classList.add('hidden');
        }

        function hideForgotPasswordModal() {
            const modal = document.getElementById('forgot-password-modal');
            const content = document.getElementById('forgot-modal-content');
            
            modal.classList.add('opacity-0');
            content.classList.remove('scale-100');
            content.classList.add('scale-95');
            
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }, 300);
        }

        // Send password reset email
        async function sendResetPasswordEmail(event) {
            event.preventDefault();
            
            const email = document.getElementById('reset-email').value;
            const messageDiv = document.getElementById('reset-message');
            const submitBtn = document.getElementById('reset-submit-btn');
            
            if (!email) {
                messageDiv.textContent = 'Please enter your email address';
                messageDiv.className = 'mb-4 p-3 rounded-lg text-sm font-body bg-error-container/20 text-error';
                messageDiv.classList.remove('hidden');
                return;
            }
            
            const supabase = getSupabase();
            if (!supabase) {
                messageDiv.textContent = 'Database not connected';
                messageDiv.className = 'mb-4 p-3 rounded-lg text-sm font-body bg-error-container/20 text-error';
                messageDiv.classList.remove('hidden');
                return;
            }
            
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="material-symbols-outlined animate-spin text-sm">refresh</span> Sending...';
            
            try {
                const { error } = await supabase.auth.resetPasswordForEmail(email, {
                    redirectTo: window.location.origin + '/pages/reset-password.html'
                });
                
                if (error) throw error;
                
                messageDiv.textContent = 'Reset link sent! Check your email.';
                messageDiv.className = 'mb-4 p-3 rounded-lg text-sm font-body bg-primary/20 text-primary';
                messageDiv.classList.remove('hidden');
                
                document.getElementById('reset-email').value = '';
                
                setTimeout(() => {
                    hideForgotPasswordModal();
                }, 3000);
                
            } catch (err) {
                messageDiv.textContent = 'Failed: ' + err.message;
                messageDiv.className = 'mb-4 p-3 rounded-lg text-sm font-body bg-error-container/20 text-error';
                messageDiv.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Send Link';
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('auth-form').addEventListener('submit', handleLogin);

            handleAuthCallback();
            checkExistingSession();
        });
    </script>

    <!-- Theme Toggle Script -->
    <script src="../js/utils/theme-toggle.js"></script>
</body>
</html>
