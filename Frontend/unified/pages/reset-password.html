<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | VERDANIST</title>
    <!-- Supabase SDK - MUST LOAD FIRST -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 50%, #0d2818 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        
        /* Animated background particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }
        
        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: rgba(75, 226, 119, 0.3);
            border-radius: 50%;
            animation: float 15s infinite;
        }
        
        @keyframes float {
            0%, 100% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) rotate(720deg);
                opacity: 0;
            }
        }
        
        .login-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }
        
        .glass-card {
            background: rgba(26, 26, 26, 0.8);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(75, 226, 119, 0.15);
            padding: 40px;
            box-shadow: 0 32px 64px rgba(0, 0, 0, 0.4), 
                        0 0 0 1px rgba(75, 226, 119, 0.1),
                        inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }
        
        .logo-section {
            text-align: center;
            margin-bottom: 32px;
        }
        
        .logo-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #4be277 0%, #22c55e 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            box-shadow: 0 8px 32px rgba(75, 226, 119, 0.3);
        }
        
        .logo-icon i {
            font-size: 28px;
            color: #000;
        }
        
        .logo-title {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 28px;
            font-weight: 800;
            color: #4be277;
            letter-spacing: 2px;
            margin-bottom: 4px;
        }
        
        .logo-subtitle {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 3px;
        }
        
        h2 {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 24px;
            font-weight: 700;
            color: #fff;
            text-align: center;
            margin-bottom: 8px;
        }
        
        .subtitle {
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            margin-bottom: 32px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.7);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        
        .input-wrapper i {
            position: absolute;
            left: 16px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 16px;
        }
        
        .input-wrapper input {
            width: 100%;
            padding: 14px 16px 14px 48px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            transition: all 0.3s ease;
        }
        
        .input-wrapper input:focus {
            outline: none;
            border-color: #4be277;
            background: rgba(75, 226, 119, 0.05);
            box-shadow: 0 0 0 3px rgba(75, 226, 119, 0.1);
        }
        
        .input-wrapper input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }
        
        .access-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #4be277 0%, #22c55e 100%);
            border: none;
            border-radius: 12px;
            color: #000;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 24px;
        }
        
        .access-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(75, 226, 119, 0.3);
        }
        
        .access-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .message {
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .message.success {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #4ade80;
        }
        
        .message.error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
        }
        
        .message.info {
            background: rgba(59, 130, 246, 0.15);
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: #60a5fa;
        }
        
        .hidden {
            display: none !important;
        }
        
        .back-link {
            display: block;
            text-align: center;
            margin-top: 24px;
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s ease;
        }
        
        .back-link:hover {
            color: #4be277;
        }
        
        .back-link i {
            margin-right: 8px;
        }
        
        #loadingOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 10, 0.9);
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 20px;
            z-index: 1000;
        }
        
        #loadingOverlay.active {
            display: flex;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(75, 226, 119, 0.2);
            border-top-color: #4be277;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- Animated particles -->
    <div class="particles">
        <div class="particle" style="left: 10%; animation-delay: 0s;"></div>
        <div class="particle" style="left: 20%; animation-delay: 2s;"></div>
        <div class="particle" style="left: 30%; animation-delay: 4s;"></div>
        <div class="particle" style="left: 40%; animation-delay: 1s;"></div>
        <div class="particle" style="left: 50%; animation-delay: 3s;"></div>
        <div class="particle" style="left: 60%; animation-delay: 5s;"></div>
        <div class="particle" style="left: 70%; animation-delay: 2.5s;"></div>
        <div class="particle" style="left: 80%; animation-delay: 1.5s;"></div>
        <div class="particle" style="left: 90%; animation-delay: 4.5s;"></div>
    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay">
        <div class="spinner"></div>
        <p style="color: rgba(255,255,255,0.8);">Processing...</p>
    </div>

    <div class="login-container">
        <div class="glass-card">
            <!-- Logo Section -->
            <div class="logo-section">
                <div class="logo-icon">
                    <i class="fas fa-seedling"></i>
                </div>
                <h1 class="logo-title">VERDANIST</h1>
                <p class="logo-subtitle">Reset Password</p>
            </div>
            
            <!-- Status Message -->
            <div id="status-message" class="message info hidden"></div>
            
            <!-- Reset Password Form -->
            <form id="reset-form">
                <div class="form-group">
                    <label class="form-label">New Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="new-password" placeholder="Enter your new password" required minlength="6">
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Confirm Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="confirm-password" placeholder="Confirm your new password" required minlength="6">
                    </div>
                </div>
                
                <button type="submit" id="submit-btn" class="access-btn">
                    Reset Password <i class="fas fa-check"></i>
                </button>
            </form>
            
            <!-- Success State (hidden initially) -->
            <div id="success-state" class="hidden" style="text-align: center;">
                <div style="width: 80px; height: 80px; background: rgba(34, 197, 94, 0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px;">
                    <i class="fas fa-check" style="font-size: 40px; color: #4be277;"></i>
                </div>
                <h2 style="margin-bottom: 12px;">Password Updated!</h2>
                <p style="color: rgba(255,255,255,0.6); margin-bottom: 24px;">Your password has been successfully reset.</p>
                <a href="login.html" class="access-btn" style="text-decoration: none;">
                    Back to Login <i class="fas fa-arrow-right"></i>
                </a>
            </div>
            
            <a href="login.html" class="back-link">
                <i class="fas fa-arrow-left"></i> Back to Login
            </a>
        </div>
    </div>

    <!-- Supabase Client -->
    <script src="../js/auth/supabase-client.js"></script>
    
    <script>
        // Get Supabase client
        function getSupabase() {
            if (window.supabase) return window.supabase;
            if (window.initSupabase) return window.initSupabase();
            return null;
        }

        // Show/hide loading overlay
        function showLoading() {
            document.getElementById('loadingOverlay').classList.add('active');
        }

        function hideLoading() {
            document.getElementById('loadingOverlay').classList.remove('active');
        }

        // Show message
        function showMessage(text, type) {
            const msgDiv = document.getElementById('status-message');
            msgDiv.textContent = text;
            msgDiv.className = `message ${type}`;
            msgDiv.classList.remove('hidden');
        }

        function hideMessage() {
            document.getElementById('status-message').classList.add('hidden');
        }

        // Check if we have a recovery token in the URL
        async function checkRecoverySession() {
            const supabase = getSupabase();
            if (!supabase) {
                showMessage('Database not connected. Please try again later.', 'error');
                return false;
            }

            showLoading();

            try {
                // Get current session - if user clicked email link, Supabase should have established session
                const { data: { session }, error } = await supabase.auth.getSession();
                
                if (error) throw error;
                
                if (!session) {
                    showMessage('Invalid or expired reset link. Please request a new password reset.', 'error');
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 3000);
                    return false;
                }
                
                return true;
            } catch (err) {
                console.error('Session check error:', err);
                showMessage('Invalid or expired reset link. Please request a new password reset.', 'error');
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 3000);
                return false;
            } finally {
                hideLoading();
            }
        }

        // Handle password reset form submission
        async function handlePasswordReset(event) {
            event.preventDefault();
            
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const submitBtn = document.getElementById('submit-btn');
            
            // Validate passwords match
            if (newPassword !== confirmPassword) {
                showMessage('Passwords do not match. Please try again.', 'error');
                return;
            }
            
            // Validate password length
            if (newPassword.length < 6) {
                showMessage('Password must be at least 6 characters long.', 'error');
                return;
            }
            
            const supabase = getSupabase();
            if (!supabase) {
                showMessage('Database not connected. Please try again later.', 'error');
                return;
            }
            
            // Show loading
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
            showLoading();
            
            try {
                // Update the user's password
                const { error } = await supabase.auth.updateUser({
                    password: newPassword
                });
                
                if (error) throw error;
                
                // Success! Show success state
                document.getElementById('reset-form').classList.add('hidden');
                document.getElementById('success-state').classList.remove('hidden');
                document.querySelector('.back-link').classList.add('hidden');
                hideMessage();
                
            } catch (err) {
                console.error('Password update error:', err);
                showMessage('Failed to update password: ' + err.message, 'error');
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Reset Password <i class="fas fa-check"></i>';
            } finally {
                hideLoading();
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            // Check for valid recovery session
            checkRecoverySession();
            
            // Setup form handler
            document.getElementById('reset-form').addEventListener('submit', handlePasswordReset);
        });
    </script>
    <script src="../js/utils/theme-toggle.js"></script>
</body>
</html>
